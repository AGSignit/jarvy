services:
  - type: web
    name: jarvy-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHONUTF8
        value: "1"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: ASSISTANT_NAME
        value: Jarvy
      - key: USER_NAME
        value: Aradhya
      - key: ALLOW_SHELL
        value: "false"
      - key: REQUIRE_CONFIRM_UNSAFE
        value: "true"
